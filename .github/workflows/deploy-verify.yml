# 배포 후 검증: main 반영 후 라이브(volt.ceo)가 새 캐시 버전을 서빙하는지 자동 확인한다.
#
# check-deploy-sync.mjs 종료 코드 규약:
#   0 = 확인 성공 / 1 = 버전 불일치 또는 배포 대기 / 2 = 실패 또는 확인 불가
#
# Cloudflare가 GitHub의 HTML 요청을 봇 챌린지로 막으면 같은 main 커밋의
# 운영 Pages 주소가 알려 주는 배포 번호를 확인한다.

name: Deploy Verify

on:
  workflow_run:
    workflows: [Smoke Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Pages can wait up to 20 minutes for the exact push, then publish its assets.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 한 번의 403으로 끝내지 않고 Pages 빌드와 전파에 필요한 시간을 준다.
      - name: Wait for Pages deploy and verify cache version
        env:
          VOLT_VERIFY_PAGES_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sleep 60
          for attempt in {1..24}; do
            echo "::group::시도 ${attempt}/24"
            set +e
            node scripts/check-deploy-sync.mjs
            code=$?
            set -e
            echo "::endgroup::"

            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -eq 2 ]; then
              echo "::error::배포 검증 실패. 위의 오류와 Cloudflare Pages의 운영 배포 기록을 확인하세요."
              exit 1
            fi
            # code 1(불일치): 배포 전파 중일 수 있으므로 재시도
            if [ "$attempt" -lt 24 ]; then
              echo "운영 배포 확인 대기 중 — 1분 후 재시도"
              sleep 60
            fi
          done
          echo "::error::기한 안에 이 커밋의 운영 배포를 확인하지 못했습니다."
          exit 1
