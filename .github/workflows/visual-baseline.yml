name: Visual Baseline

# Generate reviewable baselines on a work branch. Never write directly to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require a work branch
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$SOURCE_BRANCH" = "main" ]; then
            echo "::error::Select a work branch, review the generated artifact, and include it with the code change."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: |
          # Use the same signed Ubuntu packages and primary mirror as smoke.yml.
          # Regional mirrors can stall font downloads before screenshots start.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps --only-shell chromium
      - name: Regenerate linux baselines
        run: npx playwright test visual-regression --update-snapshots
      - name: Upload baselines for review
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines-${{ github.sha }}
          path: tests/smoke/visual-regression.spec.js-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 14
      - name: Record source commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          echo "Baselines generated from $SOURCE_COMMIT. Review images and commit them to the same work branch before merging." >> "$GITHUB_STEP_SUMMARY"
