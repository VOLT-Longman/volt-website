<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLT 관리자 CMS</title>
  <link rel="stylesheet" href="admin.css?v=20260614-12">
</head>
<body>
  <main class="admin-shell">
    <section class="login-panel" id="login-panel">
      <h1>VOLT 관리자</h1>
      <p>공지, 일정, 갤러리, 협력함대, 임원진, 연혁, 함선DB를 관리합니다.</p>
      <form id="login-form">
        <label>관리자 비밀번호 또는 토큰<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
      </form>
      <p class="admin-message" id="login-message" role="status"></p>
    </section>

    <section class="dashboard" id="dashboard" hidden>
      <header class="admin-header">
        <div><span class="eyebrow">VOLT CMS</span><h1>관리자 대시보드</h1></div>
        <button class="secondary" id="logout-button" type="button">로그아웃</button>
      </header>

      <nav class="admin-tabs" aria-label="관리 메뉴">
        <button type="button" class="active" data-tab="notices">공지</button>
        <button type="button" data-tab="events">일정</button>
        <button type="button" data-tab="gallery">갤러리</button>
        <button type="button" data-tab="partner-fleets">협력함대</button>
        <button type="button" data-tab="leadership">임원진</button>
        <button type="button" data-tab="timeline">연혁</button>
        <button type="button" data-tab="ships">함선DB</button>
      </nav>

      <section class="admin-grid">
        <article class="admin-list-card">
          <div class="card-head"><h2 id="list-title">공지 목록</h2><button type="button" id="new-button">새로 작성</button></div>
          <div class="item-list" id="item-list"></div>
        </article>

        <article class="admin-form-card">
          <h2 id="form-title">공지 작성</h2>
          <form id="cms-form"></form>
          <div class="form-actions">
            <button type="submit" form="cms-form">저장</button>
            <button type="button" class="secondary" id="cancel-button">취소</button>
            <button type="button" class="danger" id="delete-button" hidden>삭제</button>
          </div>
          <p class="admin-message" id="form-message" role="status"></p>
        </article>
      </section>
    </section>
  </main>

  <script src="../data/volt-data.js?v=20260614-12"></script>
  <script src="admin.js?v=20260614-12"></script>
</body>
</html>
